name: repository-quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit repository boundaries
        run: python scripts/audit_repository.py

      - name: Validate Skill Suite
        run: python scripts/validate_suite.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
