name: 教材／Skill 審查問題
description: 回報課綱、物理、影片、自學支援、題目、介面或隱私授權問題
title: "[Review] "
labels:
  - review
body:
  - type: markdown
    attributes:
      value: |
        請提供可重現的頁碼與證據。不要上傳含姓名、學生資料或未授權的完整教材。
  - type: input
    id: version
    attributes:
      label: 專案版本
      description: 例如 v0.4.0 或 Git commit
    validations:
      required: true
  - type: input
    id: unit
    attributes:
      label: 單元代碼與名稱
      placeholder: PBa-V.1-2-2 動能
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 頁碼／影片／題號
      placeholder: 第 3 頁 media2.mp4
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 問題類型
      options:
        - 課綱與範圍
        - 物理概念與數值
        - 影片與知識關聯
        - 九步驟與課程連貫
        - speaker notes 與自學支援
        - 學習單
        - 素養題與誘答
        - 審查介面或工具
        - 隱私、授權或檔案治理
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 嚴重度
      options:
        - blocker
        - major
        - minor
        - suggestion
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 實際看到的問題
      description: 描述畫面、文字、播放行為或輸出結果。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期結果與理由
      description: 說明應如何呈現，以及物理、課綱或教學上的理由。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 證據與重現方式
      description: 可附官方條目、推導、數值、關鍵影格描述或操作步驟；請勿附未授權全文。
    validations:
      required: true
  - type: textarea
    id: strength
    attributes:
      label: 應保留的優點
      description: 修正時不應破壞什麼？
  - type: checkboxes
    id: privacy
    attributes:
      label: 隱私與授權確認
      options:
        - label: 我沒有附上教師／學生個資、登入資訊或未授權的完整教材。
          required: true
